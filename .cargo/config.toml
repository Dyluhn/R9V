[alias]
xtask = "run --package xtask --"

# Official Linux x86_64 artifacts target the architectural baseline. Optional
# SIMD belongs behind runtime feature detection in T0v; it must never leak into
# the scalar T0 binary through the build host.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]
