name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - name: Check out pinned source graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run CPU tests
        run: python -m pytest -q tests

  static:
    name: Static release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pinned source graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install static-check dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate source, shell, descriptors, and gitlinks
        env:
          R9V_CI_REQUIRE_SHELLCHECK: "1"
        run: ./scripts/ci-static.sh
